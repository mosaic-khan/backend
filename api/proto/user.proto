syntax = "proto3";

import "google/protobuf/empty.proto";


package KhanAPI;
option go_package = "./../../pkg/UserAPIService";

service UserAPI {
  rpc RefreshToken (google.protobuf.Empty) returns (RefreshTokenResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ForgetPassword (ForgetPasswordRequest) returns (google.protobuf.Empty);
  rpc NewPasswordWithToken (NewPasswordWithTokenRequest) returns (google.protobuf.Empty);
  rpc SignUp (SignUpRequest) returns (SignUpResponse);
  rpc CodeVerification (CodeVerificationRequest) returns (CodeVerificationResponse);
  rpc PersonalInfoCompletion (PersonalInfoCompletionRequest) returns (google.protobuf.Empty);
  rpc EditProfileInfo (EditProfileInfoRequest) returns (google.protobuf.Empty);
  rpc GetUserInfo (google.protobuf.Empty) returns (GetUserInfoResponse);
  rpc ChangeUsername (ChangeUsernameRequest) returns (google.protobuf.Empty);
  rpc ChangeEmail (ChangeEmailRequest) returns (ChangeEmailResponse);
  rpc ConfirmChangeEmail (ConfirmChangeEmailRequest) returns (google.protobuf.Empty);
  rpc ChangePassword (ChangePasswordRequest) returns (google.protobuf.Empty);
  rpc ChangeProfilePic (ChangeProfilePicRequest) returns (google.protobuf.Empty);
  rpc GetUserProfile (GetUserProfileRequests) returns (GetUserProfileResponse);
  rpc GetCities (GetCitiesRequest) returns (GetCitiesResponse);
}

message User {
  string fName = 1;
  string lName = 2;
  string username = 3;
  string email = 4;
  string birthDay = 5;
  string gender = 6;
  string profilePicUrl = 7;
  string city = 8;
  string bio = 9;
}

message Profile {
  string name = 1;
  string username = 2;
  int64 profileID = 3;
  string pronouns = 4;
  string bio = 5;
  string city = 6;
  string profilePicUrl = 7;
}

message RefreshTokenResponse {
  string Token = 1;
}


// login begin

message LoginRequest {
  string userNameOrEmail = 1;
  string password = 2;
}

message LoginResponse {
  string jwtToken = 2;
}

// login end

// forget pass begin

message ForgetPasswordRequest {
  string userNameOrEmail = 1;
}

message NewPasswordWithTokenRequest {
  string resetPasswordToken = 1;
  string password = 2;
}

// forget pass end

// signUp begin

message SignUpRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message SignUpResponse {
  string token = 1;
}

message CodeVerificationRequest {
  string signUpToken = 1;
  string code = 2;
}

message CodeVerificationResponse {
  string jwtToken = 1;
}

// token in header
message PersonalInfoCompletionRequest {
  string fName = 1;
  string lName = 2;
  string birthDay = 3;
  string gender = 4;
  string bio = 5;
}

// signUp end

// EditProfile begin

message GetUserInfoResponse {
    User user = 1;
}

message EditProfileInfoRequest {
  optional string fName = 1;
  optional string lName = 2;
  optional string gender = 3;
  optional string birthDay = 4;
  optional string city = 5;
  optional string bio = 6;
}


message ChangeUsernameRequest {
  string newUsername = 1;
}

message ChangeEmailRequest {
  string newEmail = 1;
}

message ChangeEmailResponse {
  string changeEmailToken = 1;
}

message ConfirmChangeEmailRequest {
  string changeEmailToken = 1;
  string code = 2;
}

message ChangePasswordRequest {
  string oldPassword = 1;
  string newPassword = 2;
}

message ChangeProfilePicRequest {
  string newProfilePicPath = 1;
  string accessToken = 2;
}

// EditProfile End

message GetUserProfileRequests {
  optional string username = 1;
}

message GetUserProfileResponse {
  Profile profile = 1;
}

message GetCitiesRequest {
  string cityPattern = 1;
}

message GetCitiesResponse {
  repeated string cities = 1;
}

